# Shared local services of the workbench lfs-orb. services.orb.yml moves them
# onto the Docker network `lfs-orb`. Every agent uses the same instances on
# 127.0.0.1 (vm-boot.sh forwards the ports) and keeps its own database, Redis
# key prefix or bucket. The Mac cannot reach them, so the development
# credentials below stay in OrbStack.
#   Postgres 18 with pgvector  127.0.0.1:5432  user postgres, no password
#   Redis 7                    127.0.0.1:6379
#   RustFS (S3)                127.0.0.1:9000  rustfsadmin / rustfsadmin
# Data lives in Docker volumes of OrbStack, so it survives a recreate of the
# workbench.
name: lfs-services
services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql"]
  redis:
    image: redis:7
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis:/data"]
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports: ["127.0.0.1:9000:9000"]
    volumes: ["rustfs:/data"]
volumes:
  postgres:
  redis:
  rustfs:
